media:
  input: public
  output: /
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    fields:
      - name: title
        label: Title
        type: string
      - name: category
        label: Category
        type: string
      - name: date
        type: date
        default: ""
        options:
          time: false
          format: yyyy-MM-dd
      - name: excerpt
        label: Excerpt
        type: string
        default: ""
      - name: body
        label: Body
        type: rich-text